- id: attn-softmax-weights
  kind: definition
  text: Softmax turns each row of scores into non-negative weights that add up to 1, so every word gets a share
    of attention that is a fraction of its total.
  citations:
  - source: pytorch_softmax
    excerpt: will re-scale them so that the elements lie in the range [0, 1] and sum to 1
    locator: torch.nn.functional.softmax docs
  - source: vaswani2017
    excerpt: We compute the dot products of the query with all keys, divide each by √dk, and apply a softmax function
    locator: §3.2.1, Eq. (1) (p.4)
  verification:
