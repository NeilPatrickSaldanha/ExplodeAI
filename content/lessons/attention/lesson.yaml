- id: attn-origin
  kind: fact
  text: Bahdanau et al. (2014) introduced attention to neural translation so that a whole source sentence need not
    be squeezed into one fixed-length vector. In their test the plain encoder-decoder dropped sharply on long sentences,
    while the attention model trained on longer sentences (RNNsearch-50) showed no deterioration even at 50 words
    or more.
  citations:
  - source: bahdanau2014
    excerpt: it does not attempt to encode a whole input sentence into a single fixed-length vector.
    locator: §1 (p.2)
  - source: bahdanau2014
    excerpt: of RNNencdec dramatically drops as the length of the sentences increases.
    locator: §5.1 (p.6), Fig. 2
  - source: bahdanau2014
    excerpt: RNNsearch-50, especially, shows no performance deterioration even with sentences of length 50 or more.
    locator: §5.1 (p.6)
  verification:
    primary:
      status: passed
      date: '2026-10-20'
      by: pass1/deep-research
    technical:
      status: not_applicable
      notes: An English-French translation result from the paper.
    cross_check:
      status: passed
      date: '2026-10-20'
      by: pass2/independent-agent
      notes: See research_notes/Attention primary sources/pass2_cross_check.md; fixes applied.
- id: attn-additive-vs-dot
  kind: fact
  text: Bahdanau's original attention scores each position with a small neural network (additive attention). The
    Transformer uses scaled dot products instead, which the authors say are much faster and more space-efficient
    in practice.
  citations:
  - source: bahdanau2014
    excerpt: a(si−1,h j) = v⊤a tanh (Wasi−1 +Uahj),
    locator: Appendix A.1.2, Alignment Model (p.12)
  - source: vaswani2017
    excerpt: dot-product attention is much faster and more space-efficient in practice, since it can be implemented
      using highly optimized
    locator: §3.2.1 (p.4)
  verification:
    primary:
      status: passed
      date: '2026-10-20'
      by: pass1/deep-research
    technical:
      status: not_applicable
      notes: Design comparison from the papers; the toy layer uses dot products only.
    cross_check:
      status: passed
      date: '2026-10-20'
      by: pass2/independent-agent
      notes: See research_notes/Attention primary sources/pass2_cross_check.md; fixes applied.
- id: attn-qk-ov
  kind: fact
  text: 'A head can be seen as two parts: one that decides where to attend and one that decides what to move from
    the attended word. Elhage et al. call queries, keys and values, "in some sense, superficial" by-products of
    the products of the weight matrices. Their analysis covers small attention-only transformers (ignoring layer
    norm and biases) and is not peer reviewed.'
  citations:
  - source: elhage2021
    excerpt: a QK (“query-key”) circuit which computes the attention pattern, and an OV (“output-value”) circuit
      which computes how each token affects the output if attended to.
    locator: Summary, 'Conceptual Take-Aways'
  - source: elhage2021
    excerpt: Keys, queries and value vectors are, in some sense, superficial.
    locator: '''Observations about Attention Heads'''
  verification:
    primary:
      status: passed
      date: '2026-10-20'
      by: pass1/deep-research
    technical:
      status: not_applicable
      notes: An interpretive framing from a blog-style publication about toy attention-only models, not tested here.
    cross_check:
      status: passed
      date: '2026-10-20'
      by: pass2/independent-agent
      notes: See research_notes/Attention primary sources/pass2_cross_check.md; fixes applied.
- id: attn-explanation-contested
  kind: fact
  text: Attention weights are not guaranteed to explain why a model answered as it did. Jain and Wallace found they
    often do not line up with other importance measures, and Wiegreffe and Pinter argue the answer depends on what
    you mean by explanation. Both mainly studied recurrent (LSTM) models with attention, not Transformer self-attention.
  citations:
  - source: jain2019
    excerpt: do not provide meaningful explanations and should not be treated as though they do.
    locator: Abstract (p.1)
  - source: wiegreffe2019
    excerpt: 'Whether or not attention is explanation depends on the definition of explainability one is looking
      for: plausible or faithful explanations (or both).'
    locator: §6 (p.9)
  verification:
    primary:
      status: passed
      date: '2026-10-20'
      by: pass1/deep-research
    technical:
      status: not_applicable
      notes: Empirical findings from two papers about RNN models.
    cross_check:
      status: passed
      date: '2026-10-20'
      by: pass2/independent-agent
      notes: See research_notes/Attention primary sources/pass2_cross_check.md; fixes applied.
- id: attn-interpretability-hedged
  kind: fact
  text: The Transformer authors suggested self-attention could yield more interpretable models, but they only showed
    a few example heads, which "appear" related to sentence structure.
  citations:
  - source: vaswani2017
    excerpt: As side benefit, self-attention could yield more interpretable models.
    locator: §4 (p.7)
  - source: vaswani2017
    excerpt: many appear to exhibit behavior related to the syntactic and semantic structure of the sentences.
    locator: §4 (p.7)
  verification:
    primary:
      status: passed
      date: '2026-10-20'
      by: pass1/deep-research
    technical:
      status: not_applicable
      notes: Qualitative examples from the paper.
    cross_check:
      status: passed
      date: '2026-10-20'
      by: pass2/independent-agent
      notes: See research_notes/Attention primary sources/pass2_cross_check.md; fixes applied.
components:
- id: tokens
  label: Words in
  phase: input
  short: The sentence, cut into words.
  detail: Attention works on a list of words. This toy layer splits your sentence into words and punctuation marks,
    up to 12.
  claims:
  - attn-origin
  - attn-not-all-you-need
  geometry:
    shape: stack
    size:
    - 0.9
    - 0.5
    - 0.7
  position:
  - -2.45
  - 0
  - 0
  explode:
  - -1.6
  - 0
  - -1.2
  subtitle: Sentence to words
  icon: TextAa
  inputs:
  - Your sentence
  outputs:
  - Words
  breaks_if_removed: There are no words, so there is nothing to attend over.
- id: embed_pos
  label: Vectors + position
  phase: input
  short: Each word becomes a vector, plus a sense of where it sits.
  detail: Each word gets a fixed random 64-number vector, and a sine and cosine position pattern is added. Without
    positions, attention cannot tell word order.
  claims:
  - attn-position-needed
  - attn-position-encoding
  - attn-position-alternatives
  geometry:
    shape: slab
    size:
    - 0.9
    - 0.4
    - 0.7
  position:
  - -1.75
  - 0
  - 0
  explode:
  - -0.55
  - 0
  - -1.2
  subtitle: Meaning plus place
  icon: Hash
  inputs:
  - Words
  outputs:
  - Word vectors
  breaks_if_removed: Without position vectors, and with no mask, each word's output is the same whatever order the
    words come in, so the sentence is treated as a bag of words.
- id: qkv
  label: Q · K · V
  phase: project
  short: Every word makes a query, a key and a value.
  detail: Three learned matrices turn each word vector into a query (what it looks for), a key (what it offers)
    and a value (what it passes on). Several heads do this in parallel on smaller slices.
  claims:
  - attn-qkv-projections
  - attn-qk-ov
  - attn-kv-cache
  - attn-kv-cache-size
  - attn-mqa-gqa
  geometry:
    shape: prism
    size:
    - 0.9
    - 0.6
    - 0.7
  position:
  - -1.05
  - 0
  - 0
  explode:
  - 0.55
  - 0
  - -1.2
  subtitle: Three roles per word
  icon: Funnel
  inputs:
  - Word vectors
  outputs:
  - Queries
  - Keys
  - Values
  breaks_if_removed: Words are compared directly, so each word's strongest match is itself.
- id: scores
  label: Score grid
  phase: score
  short: Each query is compared with every key.
  detail: Dot each word's query with every word's key to fill an n×n grid, then divide by the square root of the
    head width so the numbers stay a sensible size.
  claims:
  - attn-weighted-sum
  - attn-scaled-dot-product
  - attn-sqrt-dk-scaling
  - attn-scaling-reason
  - attn-additive-vs-dot
  - attn-quadratic-cost
  geometry:
    shape: grid
    size:
    - 1.0
    - 0.35
    - 1.0
  position:
  - -0.35
  - 0
  - 0
  explode:
  - 1.6
  - 0
  - -1.2
  subtitle: Who matches whom
  icon: GridFour
  inputs:
  - Queries
  - Keys
  outputs:
  - Scores
  breaks_if_removed: Every visible word gets the same weight, so each output is just an average.
- id: mask
  label: Mask
  phase: score
  short: Hide the words a word is not allowed to see.
  detail: A causal mask sets the scores of later words to minus infinity so they end up with zero weight. Padding
    masks are a different thing.
  claims:
  - attn-causal-mask
  - attn-padding-vs-causal
  - attn-mask-polarity
  - attn-kv-cache-valid
  geometry:
    shape: lens
    size:
    - 0.9
    - 0.5
    - 0.7
  position:
  - 0.35
  - 0
  - 0
  explode:
  - 1.6
  - 0
  - 1.0
  subtitle: No peeking ahead
  icon: Prohibit
  inputs:
  - Scores
  outputs:
  - Masked scores
  breaks_if_removed: Every word can attend to the words after it, so it can peek at the future.
- id: softmax
  label: Softmax
  phase: weigh
  short: Scores become shares that add up to 100%.
  detail: Softmax turns each row of scores into non-negative weights that sum to 1. Very large scores make it nearly
    one-hot, which is why scaling matters.
  claims:
  - attn-softmax-weights
  - attn-softmax-stable
  - attn-softmax-saturation
  geometry:
    shape: ring
    size:
    - 0.8
    - 0.5
    - 0.8
  position:
  - 1.05
  - 0
  - 0
  explode:
  - 0.55
  - 0
  - 1.0
  subtitle: Shares of attention
  icon: Percent
  inputs:
  - Masked scores
  outputs:
  - Attention weights
  breaks_if_removed: Raw scores are used as weights, so rows do not add up to 1 and can be negative.
- id: mix
  label: Weighted sum
  phase: mix
  short: Blend the values using the weights.
  detail: 'Each word''s new vector is the weights times the value vectors: a blend that leans towards the words
    it attends to most.'
  claims:
  - attn-weighted-sum
  - attn-explanation-contested
  - attn-interpretability-hedged
  - attn-quadratic-memory
  geometry:
    shape: stack
    size:
    - 0.9
    - 0.6
    - 0.7
  position:
  - 1.75
  - 0
  - 0
  explode:
  - -0.55
  - 0
  - 1.0
  subtitle: Blend what it finds
  icon: Stack
  inputs:
  - Attention weights
  - Values
  outputs:
  - Mixed values
  breaks_if_removed: There is a table of weights but no weighted sum, so no new word vectors.
- id: output
  label: Heads + output
  phase: output
  short: Heads are joined and projected back.
  detail: The heads' results are concatenated and multiplied by one more matrix to give a new vector per word. The
    full Transformer then adds a residual connection and layer normalisation.
  claims:
  - attn-multihead-concat
  - attn-heads-additive
  - attn-multihead-motivation
  - attn-head-sizes
  - attn-residual
  geometry:
    shape: cylinder
    size:
    - 0.8
    - 0.6
    - 0.8
  position:
  - 2.45
  - 0
  - 0
  explode:
  - -1.6
  - 0
  - 1.0
  subtitle: One vector per word
  icon: ArrowsMerge
  inputs:
  - Mixed values from each head
  outputs:
  - New word vectors
  breaks_if_removed: Each head's result stays separate, so there is no single vector per word.
