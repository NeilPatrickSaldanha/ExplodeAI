- id: attn-scaling-reason
  kind: fact
  text: The Transformer authors divide scores by √d_k because they suspect that, for large d_k, large dot products
    push softmax into regions where it has extremely small gradients.
  citations:
  - source: vaswani2017
    locator: §3.2.1 (p.4)
    excerpt: We suspect that for large values of dk, the dot products grow large in magnitude, pushing the softmax
      function into regions where it has extremely small gradients
  - source: vaswani2017
    excerpt: To counteract this effect, we scale the dot products by 1√dk .
    locator: §3.2.1 (p.4)
  verification:
    primary:
      status: passed
      date: '2026-10-20'
      by: pass1/deep-research
    technical:
      status: not_applicable
      notes: The effect on training gradients is not run here. The forward effect on the weights is shown by attn-softmax-saturation.
    cross_check:
      status: passed
      date: '2026-10-20'
      by: pass2/independent-agent
      notes: See research_notes/Attention primary sources/pass2_cross_check.md; fixes applied.
- id: attn-sqrt-dk-scaling
  kind: fact
  text: If the components of a query and a key are independent with mean 0 and variance 1, their dot product has
    mean 0 and variance d_k, so scores typically grow like √d_k. Dividing by √d_k brings the spread back to about
    1 (that last step is simple arithmetic, not a sentence in the paper).
  citations:
  - source: vaswani2017
    excerpt: assume that the components of q and k are independent random variables with mean 0 and variance 1.
    locator: footnote 4 (page 4; marker in §3.2.1)
  - source: vaswani2017
    excerpt: Then their dot product, q · k = Pdki=1 qiki, has mean 0 and variance dk.
    locator: footnote 4 (page 4; marker in §3.2.1)
  verification:
    primary:
      status: passed
      date: '2026-10-20'
      by: pass1/deep-research
    technical:
      status: passed
      date: '2026-10-20'
      by: pass3/pytest
      notes: 'Measured on the toy layer: unscaled score variance is close to d_k, scaled score variance close to
        1.'
    cross_check:
      status: passed
      date: '2026-10-20'
      by: pass2/independent-agent
      notes: See research_notes/Attention primary sources/pass2_cross_check.md; fixes applied.
- id: attn-softmax-saturation
  kind: simplification
  text: When some scores are much larger than the rest, softmax puts nearly all its weight on the largest one (a
    property of the formula, not stated by the sources). In this lesson's toy layer, a 64-wide head without scaling
    puts about 90% of a word's attention on a single word on average, and scaling spreads it out.
  citations:
  - source: vaswani2017
    locator: §3.2.1 (p.4)
    excerpt: We suspect that for large values of dk, the dot products grow large in magnitude, pushing the softmax
      function into regions where it has extremely small gradients
  verification:
    primary:
      status: passed
      date: '2026-10-20'
      by: pass1/deep-research
    technical:
      status: passed
      date: '2026-10-20'
      by: pass3/pytest
      notes: Without scaling, a 64-wide head's strongest weight averages over 85%; with scaling it averages under
        60%.
    cross_check:
      status: passed
      date: '2026-10-20'
      by: pass2/independent-agent
      notes: See research_notes/Attention primary sources/pass2_cross_check.md; fixes applied.
- id: attn-multihead-concat
  kind: fact
  text: Multi-head attention runs h heads in parallel on different learned projections, concatenates their outputs
    and applies one more learned projection W^O. In the original base model h = 8 and each head has 64 dimensions.
  citations:
  - source: vaswani2017
    excerpt: On each of these projected versions of queries, keys and values we then perform the attention function
      in parallel
    locator: §3.2.2 (pp.4-5)
  - source: vaswani2017
    excerpt: MultiHead(Q, K, V) = Concat(head1, ...,headh)W O
    locator: §3.2.2 (p.5)
  - source: vaswani2017
    excerpt: we employ h = 8 parallel attention layers, or heads. For each of these we use dk = dv = dmodel/h =
      64.
    locator: §3.2.2 (p.5)
  verification:
    primary:
      status: passed
      date: '2026-10-20'
      by: pass1/deep-research
    technical:
      status: passed
      date: '2026-10-20'
      by: pass3/pytest
      notes: Heads split the model width (d_k = d_model/h) and their concatenation is d_model wide, and the layer
        matches the independent reference.
    cross_check:
      status: passed
      date: '2026-10-20'
      by: pass2/independent-agent
      notes: See research_notes/Attention primary sources/pass2_cross_check.md; fixes applied.
- id: attn-heads-additive
  kind: fact
  text: Concatenating the heads and multiplying by W^O is mathematically the same as multiplying each head's output
    by its own slice of W^O and adding the results.
  citations:
  - source: elhage2021
    excerpt: Attention heads are often described in an alternate “concatenate and multiply” formulation for computational
      efficiency, but this is mathematically equivalent.
    locator: Summary, Conceptual Take-Aways
  verification:
    primary:
      status: passed
      date: '2026-10-20'
      by: pass1/deep-research
    technical:
      status: passed
      date: '2026-10-20'
      by: pass3/pytest
      notes: Both ways give the same numbers on the toy layer.
    cross_check:
      status: passed
      date: '2026-10-20'
      by: pass2/independent-agent
      notes: See research_notes/Attention primary sources/pass2_cross_check.md; fixes applied.
- id: attn-multihead-motivation
  kind: fact
  text: The authors' reason for several heads is that a single averaged head cannot attend to information from different
    representation subspaces at different positions. On one English-German translation test, with computation held
    constant, one head was 0.9 BLEU worse than the best setting, and too many heads also hurt.
  citations:
  - source: vaswani2017
    excerpt: Multi-head attention allows the model to jointly attend to information from different representation
      subspaces at different positions. With a single attention head, averaging inhibits this.
    locator: §3.2.2 (p.5)
  - source: vaswani2017
    excerpt: While single-head attention is 0.9 BLEU worse than the best setting, quality also drops off with too
      many heads.
    locator: §6.2 (p.9)
  verification:
    primary:
      status: passed
      date: '2026-10-20'
      by: pass1/deep-research
    technical:
      status: not_applicable
      notes: A motivation and a translation benchmark from the paper, not something this toy layer can test.
    cross_check:
      status: passed
      date: '2026-10-20'
      by: pass2/independent-agent
      notes: See research_notes/Attention primary sources/pass2_cross_check.md; fixes applied.
- id: attn-causal-mask
  kind: fact
  text: A causal mask sets the scores of later positions to −∞ before the softmax, so those positions get weight
    0 and a word cannot look at the words after it. A word can still attend to itself.
  citations:
  - source: vaswani2017
    excerpt: masking out (setting to −∞) all values in the input of the softmax which correspond to illegal connections.
    locator: §3.2.3 (p.5)
  - source: vaswani2017
    excerpt: prevent positions from attending to subsequent positions.
    locator: §3.1 (p.3)
  - source: pytorch_sdpa
    excerpt: attn_bias.masked_fill_(temp_mask.logical_not(), float("-inf"))
    locator: pseudo-code
  - source: vaswani2017
    locator: §3.2.3
    excerpt: up to and including that position
  verification:
    primary:
      status: passed
      date: '2026-10-20'
      by: pass1/deep-research
    technical:
      status: passed
      date: '2026-10-20'
      by: pass3/pytest
      notes: With the mask on, every weight on a later word is exactly 0, the first word attends only to itself,
        and rows still sum to 1.
    cross_check:
      status: passed
      date: '2026-10-20'
      by: pass2/independent-agent
      notes: See research_notes/Attention primary sources/pass2_cross_check.md; fixes applied.
- id: attn-padding-vs-causal
  kind: definition
  text: In Hugging Face tokenizers the attention mask marks real tokens with 1 and padding with 0. That is a different
    thing from the causal mask, which hides later words.
  citations:
  - source: hf_glossary
    excerpt: The attention mask is a binary tensor indicating the position of the padded indices so that the model
      does not attend to them.
    locator: Glossary, "attention mask"
  - source: hf_glossary
    excerpt: 1 indicates a value that should be attended to, while 0 indicates a padded value
    locator: same
  verification:
    primary:
      status: passed
      date: '2026-10-20'
      by: pass1/deep-research
    technical:
      status: not_applicable
      notes: Library convention (Hugging Face Transformers v5.20.2 docs); the toy layer has no padding.
    cross_check:
      status: passed
      date: '2026-10-20'
      by: pass2/independent-agent
      notes: See research_notes/Attention primary sources/pass2_cross_check.md; fixes applied.
  provider: Hugging Face
- id: attn-mask-polarity
  kind: provider_specific
  text: In PyTorch's scaled_dot_product_attention a True entry in a boolean mask means "may attend". That is the
    opposite of MultiheadAttention's key_padding_mask, so the same word "mask" can mean opposite things.
  citations:
  - source: pytorch_sdpa
    excerpt: The boolean mask semantics for attn_mask are the inverse of MultiheadAttention’s key_padding_mask.
    locator: '''Note'' on boolean mask semantics'
  - source: pytorch_sdpa
    excerpt: In scaled_dot_product_attention(), True indicates values to participate in attention.
    locator: same note
  verification:
    primary:
      status: passed
      date: '2026-10-20'
      by: pass1/deep-research
    technical:
      status: not_applicable
      notes: API behaviour of PyTorch 2.14, a beta function; not reproduced here.
    cross_check:
