  provider: BERT / OpenAI / BAAI
- id: attn-not-all-you-need
  kind: fact
  text: Attention is not the whole Transformer. The original also has embeddings, positional encodings, position-wise
    feed-forward layers, residual connections and layer normalisation; its title means it dropped recurrence and
    convolutions.
  citations:
  - source: vaswani2017
    excerpt: We propose a new simple network architecture, the Transformer, based solely on attention mechanisms,
      dispensing with recurrence and convolutions entirely.
    locator: Abstract (p.1)
  - source: vaswani2017
    excerpt: each of the layers in our encoder and decoder contains a fully connected feed-forward network, which
      is applied to each position separately and identically.
    locator: §3.3 (p.5)
  verification:
    primary:
      status: passed
      date: '2026-10-20'
      by: pass1/deep-research
    technical:
      status: not_applicable
      notes: Architecture description from the paper.
    cross_check:
      status: passed
      date: '2026-10-20'
      by: pass2/independent-agent
      notes: See research_notes/Attention primary sources/pass2_cross_check.md; fixes applied.
- id: attn-residual
  kind: fact
  text: 'Around each sub-layer the original Transformer adds the input back and then applies layer normalisation:
    LayerNorm(x + Sublayer(x)). This lesson''s toy layer stops at the attention output.'
  citations:
  - source: vaswani2017
    excerpt: We employ a residual connection [11] around each of the two sub-layers, followed by layer normalization
      [ 1].
    locator: §3.1 (p.3)
  - source: vaswani2017
    excerpt: the output of each sub-layer is LayerNorm(x + Sublayer(x))
    locator: §3.1 (p.3)
  verification:
