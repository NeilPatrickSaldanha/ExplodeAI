- id: attn-head-sizes
  kind: provider_specific
  text: 'Real models differ in head count and head width: BERT-base has 12 heads on a 768-wide vector (64 each),
    GPT-3 175B has 96 heads of 128 dimensions, and bge-small-en-v1.5 has 12 heads on a 384-wide vector (32 each).'
  citations:
  - source: devlin2018bert
    excerpt: BERTBASE (L=12, H=768, A=12, Total Param-
    locator: §3 Model Architecture, p.3
  - source: brown2020gpt3
    excerpt: GPT-3 175B or “GPT-3” 175.0B 96 12288 96 128 3.2M 0.6× 10−4
    locator: Table 2.1
  - source: bge_model_card
