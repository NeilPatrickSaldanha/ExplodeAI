- id: attn-kv-cache
  kind: definition
  text: When a model generates text it keeps the keys and values of the words already processed (the KV cache) and
    reuses them instead of recomputing them for every new word.
  citations:
  - source: hf_cache_explanation
    excerpt: A key-value (KV) cache eliminates this inefficiency by storing kv pairs derived from the attention
      layers of previously processed tokens.
    locator: '"How caching works", para 1'
  - source: hf_cache_explanation
    excerpt: The stored kv pairs are retrieved from the cache and reused for subsequent tokens, avoiding the need
      to recompute.
    locator: same
  verification:
    primary:
      status: passed
      date: '2026-10-20'
      by: pass1/deep-research
    technical:
      status: not_applicable
      notes: Library behaviour (Hugging Face Transformers v5.20.2 docs); the validity of the idea is tested by attn-kv-cache-valid.
    cross_check:
      status: passed
      date: '2026-10-20'
      by: pass2/independent-agent
      notes: See research_notes/Attention primary sources/pass2_cross_check.md; fixes applied.
  provider: Hugging Face
- id: attn-kv-cache-valid
  kind: fact
  text: The cache is valid because, with a causal mask, a word that has been processed never changes when later
    words arrive.
  citations:
  - source: hf_cache_explanation
    excerpt: Once a token is processed, its representation never changes with respect to future tokens
    locator: '"How caching works", Attention matrices'
  verification:
    primary:
      status: passed
      date: '2026-10-20'
      by: pass1/deep-research
    technical:
      status: passed
      date: '2026-10-20'
      by: pass3/pytest
      notes: With the causal mask on, the outputs for the first words are identical whether or not later words are
        present.
    cross_check:
      status: passed
      date: '2026-10-20'
      by: pass2/independent-agent
      notes: See research_notes/Attention primary sources/pass2_cross_check.md; fixes applied.
- id: attn-kv-cache-size
  kind: provider_specific
  text: 'For one sequence in plain multi-head attention, the KV cache holds keys and values for every earlier word,
    every layer and every head: two times the sequence length times the number of heads times the head dimension
    times the number of layers. Multi-query and grouped-query attention use fewer key-value heads.'
  citations:
  - source: hf_llm_optimization
    excerpt: two times the sequence length times the number of attention heads times the attention head dimension
      and times the number of layers
    locator: §3.2 key-value cache
  verification:
    primary:
      status: passed
      date: '2026-10-20'
      by: pass1/deep-research
    technical:
      status: not_applicable
      notes: Memory accounting from the Hugging Face optimisation guide (v5.20.2 docs).
    cross_check:
      status: passed
      date: '2026-10-20'
      by: pass2/independent-agent
      notes: See research_notes/Attention primary sources/pass2_cross_check.md; fixes applied.
  provider: Hugging Face
- id: attn-mqa-gqa
  kind: fact
  text: Multi-query attention shares one set of keys and values across all heads, which shrinks the KV cache. Grouped-query
    attention lets groups of query heads share a key and value head, between multi-head and multi-query.
  citations:
  - source: shazeer2019mqa
    excerpt: multi-query attention, where the keys and values are shared across all of the different attention "heads"
    locator: Abstract
  - source: ainslie2023gqa
    excerpt: Grouped-query attention divides query heads into G groups, each of which shares a single key head and
      value head.
    locator: §2.2 Grouped-query attention
  - source: ainslie2023gqa
    excerpt: reducing the size of the key-value cache and therefore amount of data that needs to be loaded by a
      factor of H
    locator: §2.2
  verification:
    primary:
      status: passed
      date: '2026-10-20'
      by: pass1/deep-research
    technical:
