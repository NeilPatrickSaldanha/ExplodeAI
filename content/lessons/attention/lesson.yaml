# Lesson 04. Excerpts are verbatim from the Pass 1 notes in research_notes/Attention primary sources/ (plus a few checked in Pass 2).
id: attention
number: 4
title: Attention, exploded
summary: Watch every word decide which other words to look at, then blend what it finds. Run a real (toy) attention
  layer step by step, break it on purpose, and rebuild it.
status: published
version: 1.0.0
updated: '2026-10-20'
estimated_minutes: 25
objectives:
- Trace one self-attention head from words to queries, keys and values, scores, weights and a weighted sum.
- Explain why scores are scaled, why a mask hides later words, and why position vectors are needed.
- Read an attention grid without mistaking it for a full explanation of a model.
- 'Diagnose broken setups: peeking ahead, saturated softmax, and order-blind attention.'
prerequisites:
- Lesson 03 (embeddings) helps but is not required.
verification_report: reports/Attention verification.md
claims:
- id: attn-weighted-sum
  kind: definition
  text: Attention takes a query and a set of key-value pairs and returns a weighted sum of the values. Each value's
    weight comes from how well the query matches its key.
  citations:
  - source: vaswani2017
    excerpt: The output is computed as a weighted sum
    locator: §3.2 (pp.3-4)
  - source: vaswani2017
    excerpt: the weight assigned to each value is computed by a compatibility function of the query with the corresponding
      key
    locator: §3.2 (p.4)
  verification:
    primary:
      status: passed
      date: '2026-10-20'
      by: pass1/deep-research
    technical:
      status: passed
      date: '2026-10-20'
      by: pass3/pytest
      notes: The layer matches an independent loop implementation of the weighted sum.
    cross_check:
      status: passed
      date: '2026-10-20'
      by: pass2/independent-agent
      notes: See research_notes/Attention primary sources/pass2_cross_check.md; fixes applied.
- id: attn-qkv-projections
  kind: definition
  text: In self-attention the queries, keys and values all come from the same sequence. Each is made by multiplying
    a word's vector by a learned weight matrix (the projections W^Q, W^K and W^V).
  citations:
  - source: vaswani2017
    excerpt: linearly project the queries, keys and values h times with different, learned linear projections to
      dk, dk and dv dimensions, respectively.
    locator: §3.2.2 (p.4)
  - source: vaswani2017
    excerpt: In a self-attention layer all of the keys, values and queries come from the same place
    locator: §3.2.3 (p.5)
  verification:
    primary:
      status: passed
      date: '2026-10-20'
      by: pass1/deep-research
    technical:
      status: passed
      date: '2026-10-20'
      by: pass3/pytest
      notes: Q, K and V are built from the same input vectors by three separate matrices, as the reference implementation
        does.
    cross_check:
      status: passed
      date: '2026-10-20'
      by: pass2/independent-agent
      notes: See research_notes/Attention primary sources/pass2_cross_check.md; fixes applied.
- id: attn-scaled-dot-product
  kind: fact
  text: 'One head computes softmax(QKᵀ/√d_k)V: dot each query with every key, divide by √d_k, apply a softmax to
    get weights, then use the weights to mix the values.'
  citations:
  - source: vaswani2017
    excerpt: We compute the dot products of the query with all keys, divide each by √dk, and apply a softmax function
    locator: §3.2.1, Eq. (1) (p.4)
  - source: pytorch_sdpa
    excerpt: scale_factor = 1 / math.sqrt(query.size(-1)) if scale is None else scale
    locator: pseudo-code
  - source: pytorch_sdpa
    excerpt: attn_weight = torch.softmax(attn_weight, dim=-1)
    locator: pseudo-code
  verification:
