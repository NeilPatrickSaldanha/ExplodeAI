  description: A real attention layer with fixed random weights runs on your sentence. It shows the mechanism, not
    what a trained model attends to.
experiment:
  engine: attend
  endpoint: /api/experiments/attend/run
  corpus_note: 'A toy layer: every word gets a fixed random vector and the projections are fixed random matrices.
    Nothing is trained, so patterns show how attention works, not what a trained model attends to.'
  presets:
  - label: Cat
    text: the cat sat on the mat
    note: Repeated words ("the") start from the same vector, but with random weights that does not make them attend
      to each other. A trained model learns which words to match.
  - label: Pronoun
    text: the animal did not cross the street because it was too tired
    note: A trained model might link "it" to "animal". This toy layer has random weights, so it will not. Do not
      read meaning into its grid.
  - label: Order
    text: dog bites man
    note: 'Turn Position vectors off and the Causal mask off: the layer can no longer tell this sentence from "man
      bites dog". The Order matters check in the stats shows it.'
challenges:
- id: peeking
  title: The model that cheats
  brief: This layer is meant to write text left to right, so each word may only see the words before it. Right now
    words look ahead. Fix it without changing the sentence.
  broken_params:
    text: the cat sat on the mat
    heads: 2
    scale: true
    causal: false
    position: true
  locked_params:
  - text
  - heads
  - scale
  - position
  checks:
  - type: no_future_attention
  hint: Which control hides later words?
  explanation: A causal mask sets the scores of later words to minus infinity before the softmax, so they get exactly
    zero weight. Without it every word can attend to words that, when generating, would not exist yet.
  claims:
  - attn-causal-mask
- id: one-word-takes-all
  title: One word takes everything
  brief: With a wide head and no scaling, almost every word attends to a single word. Spread the attention out without
    changing the sentence.
  broken_params:
    text: the animal did not cross the street because it was too tired
    heads: 1
    scale: false
    causal: false
    position: true
  locked_params:
  - text
  - causal
  - position
  checks:
  - type: not_saturated
    limit: 80
  hint: Scores grow with the head width. What did the paper divide them by?
  explanation: Unscaled dot products have a spread of about √d_k, so a 64-wide head produces scores far apart and
    softmax becomes nearly one-hot. Dividing by √d_k, or splitting into four or more narrower heads, keeps the weights
    spread out. Two heads are not enough without scaling.
  claims:
  - attn-sqrt-dk-scaling
  - attn-softmax-saturation
- id: bag-of-words
  title: Order-blind attention
  brief: This layer gives each word the same output for "dog bites man" and "man bites dog", whichever order the
    words come in. Make it sensitive to word order without changing the sentence.
  broken_params:
    text: dog bites man
    heads: 2
    scale: true
    causal: false
    position: false
  locked_params:
  - text
  - heads
  - scale
  - causal
  checks:
  - type: order_matters
  hint: What tells attention where each word sits?
  explanation: Self-attention only compares word vectors, so without position information it treats the sentence
    as a set of words. Adding position vectors makes each word's output depend on order. (A causal mask would too,
    but it is locked in this challenge.)
  claims:
  - attn-position-needed
  - attn-position-encoding
reconstruction:
  prompt: Put the steps of one attention layer in an order that could actually run. Each step must come after everything
    it needs.
  dependencies:
    tokens: []
    embed_pos:
    - tokens
    qkv:
    - embed_pos
    scores:
    - qkv
    mask:
    - scores
    softmax:
    - mask
    mix:
    - softmax
    - qkv
    output:
    - mix
tour:
- component: tokens
  title: Start with the words
  body: The sentence is cut into words, and every word will get its own turn to decide what to look at.
  claims:
  - attn-origin
- component: embed_pos
  title: Meaning plus position
  body: Each word becomes a vector, and a position pattern is added because attention alone cannot tell word order.
  claims:
  - attn-position-needed
- component: qkv
  title: Query, key, value
  body: Every word makes a query (what it looks for), a key (what it offers) and a value (what it passes on).
  claims:
  - attn-qkv-projections
- component: scores
  title: Compare everything
  body: Each query is compared with every key. Scores are divided by √d_k so they do not grow too large.
  claims:
  - attn-scaled-dot-product
  - attn-sqrt-dk-scaling
- component: mask
  title: No peeking
  body: When generating text, later words are hidden so a word cannot see the future.
  claims:
  - attn-causal-mask
- component: softmax
  title: Scores to shares
  body: Softmax turns each row into weights that add up to 100%.
  claims:
  - attn-softmax-weights
- component: mix
  title: Blend the values
  body: Each word's new vector leans towards the words it attends to most. A heatmap of these weights is not a full
    explanation of a model.
  claims:
  - attn-weighted-sum
  - attn-explanation-contested
- component: output
  title: Join the heads
  body: Several heads work on smaller slices in parallel. Their results are joined and projected back to one vector
    per word.
  claims:
  - attn-multihead-concat
