- id: attn-position-needed
  kind: fact
  text: Self-attention alone has no sense of word order, so position information has to be added. In this lesson's
    toy layer, with no position vectors and no mask, every word's output is the same whatever order the words arrive
    in.
  citations:
  - source: vaswani2017
    excerpt: in order for the model to make use of the order of the sequence, we must inject some information about
      the relative or absolute position
    locator: §3.5 (p.6)
  verification:
    primary:
      status: passed
      date: '2026-10-20'
      by: pass1/deep-research
    technical:
      status: passed
      date: '2026-10-20'
      by: pass3/pytest
      notes: Reversing the sentence only reverses the outputs when positions and the mask are off, and changes them
        when either is on.
    cross_check:
      status: passed
      date: '2026-10-20'
      by: pass2/independent-agent
      notes: See research_notes/Attention primary sources/pass2_cross_check.md; fixes applied.
- id: attn-position-encoding
  kind: fact
  text: The original Transformer adds fixed sine and cosine waves of different frequencies to the word vectors to
    encode each position.
  citations:
  - source: vaswani2017
    excerpt: we add "positional encodings" to the input embeddings at the bottoms of the encoder and decoder stacks.
    locator: §3.5 (p.6)
  - source: vaswani2017
    excerpt: The wavelengths form a geometric progression from 2π to 10000 · 2π.
    locator: §3.5 (p.6)
  verification:
    primary:
      status: passed
      date: '2026-10-20'
      by: pass1/deep-research
    technical:
      status: passed
      date: '2026-10-20'
