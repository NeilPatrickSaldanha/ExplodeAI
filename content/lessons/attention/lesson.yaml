visuals:
- id: ablation
  kind: real_execution
  label: Real execution, step removed
  description: The toy attention layer really runs without the chosen step, side by side with the full layer.
- id: exploded-view
  kind: conceptual
  label: Conceptual diagram
  description: Positions and shapes are a visual metaphor. Data flow follows the real order of the computation.
- id: data-flow
  kind: conceptual
  label: Conceptual animation
  description: Moving packets show which step feeds which. Solid lines carry words, dashed lines carry vectors,
    dotted lines carry scores and weights. Speed carries no meaning.
- id: experiment
