- id: attn-position-alternatives
  kind: fact
  text: Sinusoidal positions were chosen on a hypothesis, and learned position embeddings gave nearly identical
    results. BERT sums token, segment and position embeddings, and rotary embeddings (RoPE) rotate the word vector
    by an angle that depends on its position.
  citations:
  - source: vaswani2017
    excerpt: we hypothesized it would allow the model to easily learn to attend by relative positions
    locator: §3.5 (p.6)
  - source: vaswani2017
    excerpt: found that the two versions produced nearly identical results (see Table 3 row (E)).
    locator: §3.5 (p.6)
  - source: devlin2018bert
    excerpt: constructed by summing the corresponding token, segment, and position embeddings
    locator: §3 Input/Output Representations
  - source: su2021roformer
    locator: §1
    excerpt: simply rotate the affine-transformed word embedding vector by amount of angle multiples of its position
      index
  verification:
    primary:
      status: passed
      date: '2026-10-20'
      by: pass1/deep-research
    technical:
      status: not_applicable
      notes: Design history and alternatives from papers; the toy layer uses only sinusoids.
    cross_check:
      status: passed
      date: '2026-10-20'
      by: pass2/independent-agent
      notes: See research_notes/Attention primary sources/pass2_cross_check.md; fixes applied.
- id: attn-quadratic-cost
  kind: fact
  text: 'Self-attention compares every word with every other word, so a layer''s cost grows with the square of the
    sequence length n: O(n²·d) for vector width d.'
  citations:
  - source: vaswani2017
    excerpt: n is the sequence length, d is the representation dimension
    locator: Table 1 caption, p.6
  - source: vaswani2017
    excerpt: Self-Attention O(n2 · d) O(1) O(1)
    locator: Table 1 row 1, p.6
  verification:
    primary:
      status: passed
      date: '2026-10-20'
      by: pass1/deep-research
    technical:
      status: passed
      date: '2026-10-20'
      by: pass3/pytest
