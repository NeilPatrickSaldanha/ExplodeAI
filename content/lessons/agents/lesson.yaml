      notes: See research_notes/Agents primary sources/pass2_cross_check.md. Wording, locators and notes fixed from
        it; every excerpt re-checked word for word against the live page.
    technical:
      status: passed
      date: '2026-10-22'
      by: pass3/pytest
      notes: ExplodeAI's approval gate holds a refund until a person approves it. It shows the pattern and does
        not implement MCP.
  provider: Model Context Protocol
components:
- id: goal
  label: Goal
  phase: input
  short: What the customer asked for.
  detail: The request arrives as plain text. It is the first message in the conversation and the thing every later
    step works towards. Here the customer writes to a made-up bike shop.
  claims:
  - agent-workflow-vs-agent
  - agent-loop
  geometry:
    shape: card
    size:
    - 0.9
    - 0.5
    - 0.7
  position:
  - -2.2
  - 0
  - -0.8
  explode:
  - -0.9
  - 0
  - -0.9
  subtitle: The customer's request
  icon: Target
  inputs:
  - Customer message
  outputs:
  - First message
  breaks_if_removed: Nothing tells the agent what to do, so it does nothing.
- id: tools
  label: Tool registry
  phase: input
  short: The menu of things the agent may ask for.
  detail: Each tool has a name, a plain-language description and a JSON Schema for its arguments. The model never
    sees the code behind a tool, only this description of it.
  claims:
  - tool-definition
  - tool-descriptions-matter
  - mrkl-origin
  - mcp-tools-primitive
  geometry:
    shape: grid
    size:
    - 1.0
    - 0.35
    - 0.8
  position:
  - -2.2
  - 0
  - 0.8
  explode:
  - -0.9
  - 0
  - 0.9
  subtitle: Names, descriptions, schemas
  icon: Wrench
  inputs:
  - Tool definitions
  outputs:
  - Tool list for the model
  breaks_if_removed: The agent cannot look anything up, so it answers without checking the order or the policy.
- id: decide
  label: Decide
  phase: decide
  short: Pick a tool and its arguments, or give the final answer.
  detail: The model reads the goal, the tool list and everything so far, then either asks for a tool call or writes
    its final answer. In this lesson a short stand-in rule plays the model, and it is labelled as a simulation.
  claims:
  - tool-choice
  - loop-stop-reason
  - react-origin
  - toolformer-origin
  geometry:
    shape: lens
    size:
    - 0.9
    - 0.6
    - 0.7
  position:
  - -0.9
  - 0
  - 0
  explode:
  - -0.2
  - 0
  - 0
  subtitle: Call a tool or answer
  icon: Brain
  inputs:
  - Goal
  - Tool list
  - Conversation so far
  outputs:
  - A tool call, or the final answer
  breaks_if_removed: Nothing chooses an action, so no tool is ever called and no answer comes out.
- id: validate
  label: Check
  phase: act
  short: Is the call well formed?
  detail: Before anything runs, the application checks the arguments against the tool's schema. A bad call is turned
    into an error message instead of being run.
  claims:
  - validate-tool-inputs
  geometry:
    shape: ring
    size:
    - 0.8
    - 0.5
    - 0.8
  position:
  - 0.3
  - 0
  - -0.8
  explode:
  - 0.3
  - 0
  - -0.9
  subtitle: Arguments against the schema
  icon: ShieldCheck
  inputs:
  - Tool call
  outputs:
  - Checked call, or an error
  breaks_if_removed: A malformed order ID goes straight to the tool, which finds no such order, so the agent tells
    the customer their order doesn't exist.
- id: execute
  label: Run
  phase: act
  short: The application runs the tool.
  detail: The model only asked. Ordinary code in the application does the work, and anything that changes something
    real, like a refund, can wait here for a person to approve it.
  claims:
  - tools-run-in-application
  - owasp-excessive-agency
  - mcp-human-in-loop
  geometry:
    shape: prism
    size:
    - 0.9
    - 0.6
    - 0.7
  position:
  - 1.5
  - 0
  - -0.8
  explode:
  - 0.9
  - 0
  - -0.9
  subtitle: Your code does the work
  icon: Wrench
  inputs:
  - Checked call
  outputs:
  - Raw tool output
  breaks_if_removed: Tool calls are made but nothing runs them, so no result ever comes back and the agent repeats
    the same request until the step limit stops it.
- id: observe
  label: Result
  phase: observe
  short: What the tool sent back.
  detail: The output, or the error, goes back to the model as a message that points at the call it answers. Whatever
    a tool returns is data, but the model reads it like everything else.
  claims:
  - tool-result-linked
  - tool-errors-are-results
  - indirect-injection
  - injection-no-foolproof
  geometry:
    shape: slab
    size:
    - 0.9
    - 0.4
    - 0.7
  position:
  - 1.5
  - 0
  - 0.8
  explode:
  - 0.9
  - 0
  - 0.9
  subtitle: Output goes back in
  icon: Eye
  inputs:
  - Raw tool output
  outputs:
  - A result message
  breaks_if_removed: Tools run but their results never reach the agent, so it repeats the same call until the step
    limit stops it.
- id: context
  label: Context
  phase: remember
  short: The conversation, re-read on every step.
  detail: 'In a plain API loop, each step sends the whole conversation to the model again: the instructions, the
    tool list, every call and every result. The pile grows with each step, and every token of it is read again (and,
    unless the provider charges less for a repeated start, paid for again).'
  claims:
  - context-resent
  - tool-tokens-billed
  - context-window-limit
  geometry:
    shape: cylinder
    size:
    - 0.8
    - 0.6
    - 0.8
  position:
  - 0.3
  - 0
  - 0.8
  explode:
  - 0.3
  - 0
  - 0.9
  subtitle: Re-read every step
  icon: Notebook
  inputs:
  - Result message
  outputs:
  - A longer conversation
  breaks_if_removed: The agent only remembers its goal and the latest result, so it forgets what it found and goes
    round in circles.
- id: stop
  label: Stop
  phase: finish
  short: Answer, or run out of steps.
  detail: The loop ends when the model gives a final answer. A step limit is a second way out, for the day the model
    never does. A loop can also pause while it waits for a person to approve something.
  claims:
  - stopping-conditions
  - sdk-max-turns
  - agents-cost-errors
  geometry:
    shape: stack
    size:
    - 0.9
    - 0.5
    - 0.7
  position:
  - -0.9
  - 0
  - 1.7
  explode:
  - -0.2
  - 0
  - 0.9
  subtitle: Done, or cut off
  icon: FlagCheckered
  inputs:
  - Decision
  outputs:
  - Answer, or a stopped run
  breaks_if_removed: Nothing ends the loop, not even the agent's own answer, so it keeps running until the experiment's
    hard cap cuts it off.
