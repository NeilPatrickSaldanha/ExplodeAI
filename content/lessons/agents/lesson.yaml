- id: owasp-excessive-agency
  kind: fact
  text: OWASP's guidance for excessive agency (LLM06:2025) is to limit an agent's extensions and permissions to
    the minimum necessary, and to require a human to approve high-impact actions before they are taken.
  citations:
  - source: owasp_llm06
    excerpt: Limit the extensions that LLM agents are allowed to call to only the minimum necessary.
    locator: Prevention and mitigation
  - source: owasp_llm06
    excerpt: Limit the permissions that LLM extensions are granted to other systems to the minimum necessary
    locator: Prevention and mitigation
  - source: owasp_llm06
    excerpt: Utilise human-in-the-loop control to require a human to approve high-impact actions before they are
      taken.
    locator: Prevention and mitigation
  verification:
    primary:
      status: passed
      date: '2026-10-22'
      by: pass1/deep-research
    cross_check:
      status: passed
      date: '2026-10-22'
      by: pass2/independent-agent
      notes: See research_notes/Agents primary sources/pass2_cross_check.md. Wording, locators and notes fixed from
        it; every excerpt re-checked word for word against the live page.
    technical:
      status: passed
      date: '2026-10-22'
      by: pass3/pytest
      notes: In the experiment, removing the refund tool or requiring approval each stop the injected refund.
- id: mcp-tools-primitive
  kind: provider_specific
  text: In the Model Context Protocol (specification 2025-06-18) servers expose tools to language models. Clients
    discover them with tools/list and invoke them with tools/call, and a tool has a name, a description and an inputSchema.
  citations:
  - source: mcp_tools_20250618
    excerpt: allows servers to expose tools that can be invoked by language models.
    locator: Tools
  - source: mcp_tools_20250618
    excerpt: To discover available tools, clients send a tools/list request.
    locator: Listing Tools
  - source: mcp_tools_20250618
    excerpt: 'To invoke a tool, clients send a tools/call request:'
    locator: Calling Tools
  - source: mcp_tools_20250618
    excerpt: 'inputSchema: JSON Schema defining expected parameters'
    locator: Data Types (Tool)
  verification:
    primary:
      status: passed
      date: '2026-10-22'
      by: pass1/deep-research
    cross_check:
      status: passed
      date: '2026-10-22'
      by: pass2/independent-agent
      notes: See research_notes/Agents primary sources/pass2_cross_check.md. Wording, locators and notes fixed from
        it; every excerpt re-checked word for word against the live page.
    technical:
      status: not_applicable
      notes: Protocol specification; ExplodeAI does not implement MCP.
  provider: Model Context Protocol
- id: mcp-human-in-loop
  kind: provider_specific
  text: The MCP specification says there SHOULD always be a human in the loop with the ability to deny tool invocations,
    and that clients SHOULD prompt for user confirmation on sensitive operations.
  citations:
  - source: mcp_tools_20250618
    excerpt: there SHOULD always be a human in the loop with the ability to deny tool invocations.
    locator: User Interaction Model
  - source: mcp_tools_20250618
    excerpt: Prompt for user confirmation on sensitive operations
    locator: Security Considerations (clients SHOULD)
  verification:
