    excerpt: They are typically just LLMs using tools based on environmental feedback in a loop.
    locator: Agents
  - source: anthropic_tool_how
    excerpt: 'every tool call is a round trip: the model asks, you execute, you report back, the model continues.'
    locator: The agentic loop (client tools)
