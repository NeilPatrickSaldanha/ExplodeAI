- id: sdk-max-turns
  kind: provider_specific
  text: In the OpenAI Agents SDK the runner runs the model's tool calls and re-runs the loop until the model produces
    a final output with no tool calls. Passing max_turns caps this and raises MaxTurnsExceeded when exceeded; max_turns=None
    disables the limit.
  citations:
  - source: openai_agents_running
    excerpt: If the LLM produces tool calls, we run those tool calls, append the results, and re-run the loop.
    locator: The agent loop
  - source: openai_agents_running
    excerpt: If we exceed the max_turns passed, we raise a MaxTurnsExceeded exception.
    locator: The agent loop
  - source: openai_agents_running
    excerpt: Pass max_turns=None to disable this turn limit.
    locator: The agent loop
  verification:
