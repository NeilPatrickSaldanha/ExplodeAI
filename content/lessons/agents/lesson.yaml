    excerpt: Repeat from step 2 while stop_reason is "tool_use".
    locator: The agentic loop (client tools)
  - source: anthropic_tool_how
    excerpt: The loop exits on any other stop reason ("end_turn", "max_tokens", "stop_sequence", or "refusal")
    locator: The agentic loop (client tools)
