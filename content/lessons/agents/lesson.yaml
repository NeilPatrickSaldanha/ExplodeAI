id: agents
number: 5
title: Tool-using agents, exploded
summary: 'See a model in a loop: it decides, the application acts, and the result goes back in. Run a real agent
  loop with real tools (the decisions come from a clearly labelled stand-in), break it on purpose, and rebuild it.'
status: published
version: 1.0.0
updated: '2026-10-22'
estimated_minutes: 30
objectives:
- 'Trace one pass round an agent loop: goal, tool list, decision, check, run, result, memory and stop.'
- Explain why the model only asks for a tool and the application runs it, and why the application must check the
  call first.
- 'Read the cost of a loop: the whole conversation is re-read on every step.'
- 'Diagnose broken setups: a loop that never stops, vague tool descriptions, and an instruction hidden in a tool
  result.'
prerequisites:
- Lessons 01 to 04 help but are not required. Lesson 01 introduces the made-up shop.
claims:
- id: agent-workflow-vs-agent
  kind: definition
  text: Anthropic separates workflows, where code orchestrates the model and tools along predefined paths, from
    agents, where the model directs its own process and tool use. It calls both agentic systems.
  citations:
  - source: anthropic_building_agents
    excerpt: Workflows are systems where LLMs and tools are orchestrated through predefined code paths.
    locator: What are agents?
  - source: anthropic_building_agents
    excerpt: Agents, on the other hand, are systems where LLMs dynamically direct their own processes and tool usage
    locator: What are agents?
  - source: anthropic_building_agents
    excerpt: At Anthropic, we categorize all these variations as agentic systems
    locator: What are agents?
  verification:
