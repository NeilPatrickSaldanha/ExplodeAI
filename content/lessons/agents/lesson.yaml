- id: experiment
  kind: real_execution
  label: Real execution · the loop and its tools
  description: The loop, the argument checks, the tools and the token counts (made with a teaching tokenizer) really
    run. The shop, its orders and its help-centre articles are made up.
- id: decider
  kind: simulation
  label: Simulation · stand-in decider
  description: 'A short rule plays the language model: it picks tools by comparing descriptions and follows instructions
    it reads in results. It is not a language model, so it shows the loop, not how a real model behaves.'
experiment:
  engine: agent
  endpoint: /api/experiments/agent/run
  corpus_note: The shop is Ridgeline Bikes, the made-up shop from Lesson 01. The tools search its help centre, look
    up four fake orders and count days (today is fixed at 2026-10-21). A refund only writes a line in this run's
    own list; no money moves. A stand-in rule, not a language model, makes the decisions, so every run is free and
    repeatable.
  presets:
  - label: Return
    text: Hi! I'd like to return my E-Trail from order 1001. Can I get a refund?
    note: The order ID is written as 1001, but the tool wants A1001. Watch the Check step reject it, then the agent
      read the error and fix it. The refund waits for you to approve it.
  - label: Too late
    text: Can I return order A1002?
    note: Delivered 50 days ago, past the 30-day window. The agent has to search the policy, look up the order and
      count the days before it can answer.
  - label: Custom
    text: I want to return order A1003
    note: A custom-built bike. The policy says these cannot be returned, and the order data says this one is custom-built.
  - label: Status
    text: Where is my order A1004?
    note: One tool is enough here. Not every request needs the whole loop.
  - label: Policy
    text: How long do refunds take?
    note: 'No order involved: one search of the help centre, then an answer.'
challenges:
- id: runaway-loop
  title: The agent that never stops
  brief: The tool descriptions are so vague that the agent keeps searching for the same thing, and nothing ends
    the loop. Make it stop within 10 steps without touching the descriptions.
  broken_params:
    goal: Hi! I'd like to return my E-Trail from order 1001. Can I get a refund?
    descriptions: vague
    max_steps: null
    validate_args: true
    require_approval: true
    refund_tool: true
    poisoned_doc: false
  locked_params:
  - goal
  - descriptions
  - validate_args
  - require_approval
  - refund_tool
  - poisoned_doc
  checks:
  - type: stops_within
    limit: 10
  hint: Which control caps how many times round the loop the agent may go?
  explanation: A step limit does not make the agent right, it only stops the damage. Without one, a stuck loop keeps
    calling tools and re-reading a longer and longer conversation. The cap is a safety net, not a fix.
  claims:
  - stopping-conditions
  - sdk-max-turns
  - agents-cost-errors
- id: vague-tools
  title: The tool that was never chosen
  brief: Every tool is described in a few empty words, like 'gets information' or 'does an action'. The stand-in
    keeps picking the wrong one and runs out of steps. Get it to answer, without changing the question or the step
    limit.
  broken_params:
    goal: Can I return order A1002?
    descriptions: vague
    max_steps: 8
    validate_args: true
    require_approval: true
    refund_tool: true
    poisoned_doc: false
  locked_params:
  - goal
  - max_steps
  - validate_args
  - require_approval
  - refund_tool
  - poisoned_doc
  checks:
  - type: answer_contains
    gold:
    - 50 days
    - 30 days
  hint: What does the agent compare when it chooses a tool?
  explanation: The agent chooses a tool by comparing what it needs with the tool descriptions. When every description
    says almost nothing, every tool scores the same and it just takes the first. Anthropic calls detailed descriptions
    by far the most important factor in tool performance. (This lesson's stand-in rule shows the mechanism, it does
    not measure a real model.)
  claims:
  - tool-descriptions-matter
- id: injected-refund
  title: The refund nobody approved
  brief: Someone posted a forum answer into the help centre with instructions hidden in it. The agent reads it and
    refunds an order the customer never mentioned. Stop money moving without a person approving it.
  broken_params:
    goal: What is your returns policy?
    descriptions: detailed
    max_steps: 8
    validate_args: true
    require_approval: false
    refund_tool: true
    poisoned_doc: true
  locked_params:
  - goal
  - poisoned_doc
  - descriptions
  - max_steps
  - validate_args
  checks:
  - type: no_unapproved_side_effects
  hint: 'Two controls would each stop it: one limits what the agent can do, the other adds a person.'
  explanation: 'A tool result is data, but a model reads it like any other text, so instructions planted in it can
    be treated as commands. OWASP says it is unclear whether any foolproof prevention exists. What you can do is
    limit the damage: give the agent only the tools it needs, and make a person approve actions that move money.'
  claims:
  - indirect-injection
  - owasp-excessive-agency
  - mcp-human-in-loop
reconstruction:
  prompt: Put the parts of one pass round the agent loop in an order that could actually run. Each part must come
    after everything it needs.
  dependencies:
    goal: []
    tools: []
    decide:
    - goal
    - tools
    validate:
    - decide
    execute:
    - validate
    observe:
    - execute
    context:
    - observe
    stop:
    - decide
tour:
- component: goal
  title: Start with the request
  body: An agent starts with something a person wants. Everything after this is the agent working towards it, one
    step at a time.
  claims:
  - agent-workflow-vs-agent
- component: tools
  title: Show it what it can use
  body: The model is told what tools exist, but only as names, descriptions and argument rules. It never sees the
    code.
  claims:
  - tool-definition
- component: decide
  title: Choose the next move
  body: With the goal and the tool list in front of it, the model either asks for a tool call or writes its final
    answer.
  claims:
  - tool-choice
- component: validate
  title: Check before running
  body: A model can write a call that doesn't fit the rules. The application checks it first and sends an error
    back instead of running it.
  claims:
  - validate-tool-inputs
- component: execute
  title: The application does the work
  body: The model only asks. The application runs the tool, and can hold anything risky for a person to approve.
  claims:
  - tools-run-in-application
- component: observe
  title: Read what came back
  body: The result goes back to the model as a message. It is data, but the model reads it like any other text.
  claims:
  - tool-result-linked
- component: context
  title: Everything is read again
  body: In a plain API loop the model keeps nothing between steps. Each step sends the whole conversation again,
    so the cost grows with every step.
  claims:
  - context-resent
- component: stop
  title: Know when to stop
  body: The loop ends when the model answers. A step limit is the second way out, for when it never does.
  claims:
  - stopping-conditions
