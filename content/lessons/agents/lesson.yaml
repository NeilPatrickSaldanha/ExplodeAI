- id: tool-choice
  kind: provider_specific
  text: 'Anthropic, OpenAI and Gemini let the application set how free the model is: automatic (the model decides
    whether to call a tool), a mode that requires some tool call (Anthropic any, OpenAI required, Gemini ANY), or
    a named tool (Anthropic tool, OpenAI forced function). Not every model supports the required and forced modes.'
  citations:
  - source: anthropic_tool_define
    excerpt: auto allows Claude to determine whether to call any provided tools. This is the default value when
      tools are provided.
    locator: Forcing tool use (tool_choice)
  - source: anthropic_tool_define
    excerpt: any tells Claude that it must use one of the provided tools, but doesn't force a particular tool.
    locator: Forcing tool use (tool_choice)
  - source: anthropic_tool_define
    excerpt: Not every model and setting supports forced tool use.
    locator: Forcing tool use
  - source: openai_function_calling
