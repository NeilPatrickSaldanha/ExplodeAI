- id: loop-stop-reason
  kind: provider_specific
  text: For client tools in Anthropic's API, a reply that asks for a tool has stop_reason "tool_use". The application
    keeps looping while that is the stop reason, and the loop exits on any other, such as "end_turn" for a final
    answer.
  citations:
  - source: anthropic_tool_how
    excerpt: 'Claude responds with stop_reason: "tool_use" and one or more tool_use blocks.'
    locator: The agentic loop (client tools)
