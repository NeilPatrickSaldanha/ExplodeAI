      by: pass3/pytest
      notes: The experiment's stand-in follows an instruction hidden in a retrieved page, on purpose. It shows the
        mechanism and does not measure real models.
- id: injection-no-foolproof
  kind: fact
  text: OWASP lists prompt injection as LLM01 in its 2025 Top 10 for LLM applications. It says it is unclear whether
    fool-proof prevention exists, and that RAG and fine-tuning do not fully mitigate it.
  citations:
  - source: owasp_llm01
    excerpt: it is unclear if there are fool-proof methods of prevention for prompt injection.
    locator: Prevention and Mitigation Strategies
  - source: owasp_llm01
    excerpt: research shows that they do not fully mitigate prompt injection vulnerabilities
    locator: Description
  - source: owasp_llm01
