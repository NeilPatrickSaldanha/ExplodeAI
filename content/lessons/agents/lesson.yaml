- id: indirect-injection
  kind: fact
  text: Greshake et al. (2023) argue that LLM-integrated applications blur the line between data and instructions,
    and show how instructions planted in data likely to be retrieved can then act like arbitrary code execution
    and control whether and how other APIs are called.
  citations:
  - source: greshake2023injection
    excerpt: by strategically injecting prompts into data likely to be retrieved
    locator: Abstract
  - source: greshake2023injection
    excerpt: We argue that LLM-Integrated Applications blur the line between data and instructions.
    locator: Abstract
  - source: greshake2023injection
    excerpt: We show how processing retrieved prompts can act as arbitrary code execution
    locator: Abstract
  - source: greshake2023injection
    excerpt: control how and if other APIs are called
    locator: Abstract
  verification:
    primary:
      status: passed
      date: '2026-10-22'
      by: pass1/deep-research
    cross_check:
      status: passed
      date: '2026-10-22'
      by: pass2/independent-agent
      notes: See research_notes/Agents primary sources/pass2_cross_check.md. Wording, locators and notes fixed from
        it; every excerpt re-checked word for word against the live page.
    technical:
