# Local development. Works with no API keys: paid AI stays disabled unless you
# set AI_FEATURES_ENABLED=true (and keys) in backend/.env yourself.
services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file:
      - path: backend/.env
        required: false
    environment:
      DATABASE_URL: sqlite:////app/backend/data/explodeai.sqlite3
      CORS_ORIGINS: http://localhost:5173,http://127.0.0.1:5173
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - explodeai-data:/app/backend/data
      - ./content:/app/content:ro

  frontend:
    build:
      context: frontend
    environment:
      VITE_API_PROXY: http://backend:8000
    ports:
      - "127.0.0.1:5173:5173"
    volumes:
      - ./frontend/src:/app/frontend/src
    depends_on:
      backend:
        condition: service_healthy

volumes:
  explodeai-data:
